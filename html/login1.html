<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 페이지</title>
    <link rel="stylesheet" href="/css/login1.css" />
    <script>
      function validatePassword() {
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirm_password").value;
        if (!password) {
            document.getElementById("message").innerHTML = "비밀번호를 설정해주세요.";
        } else if (password != confirmPassword) {
          document.getElementById("message").innerHTML = "비밀번호가 일치하지 않습니다."
        } else {
            document.getElementById("message").innerHTML = "비밀번호가 일치합니다.";
        }
      }

      function checkUsername() { 
        var username = document.getElementById("username").value; if (username) { 
          alert("사용가능한 아이디 입니다."); 
          } else { 
            alert("아이디를 입력해주세요.");
          } 
        }
    </script>
  </head>
  <body>
    <div class="signup-form">
      <h2>회원가입</h2>
        <form>
          <label for="name">이름:</label>
          <input type="text" id="name" name="name" required>
          
          <label for="username">아이디:</label>
          <input type="text" id="username" name="username" required>
          <button type="button" onclick="checkUsername()" class="checkUsernameBox">아이디 중복 확인</button>

          <label for="email">이메일:</label>
          <input type="email" id="email" name="email" required>
        
          <label for="phone">전화번호:</label>
          <input type="tel" id="phone" name="phone" required>
        
          <label for="password">비밀번호:</label>
          <input type="password" id="password" name="password" required onkeyup="validatePassword()">
        
          <label for="confirm_password">비밀번호 확인:</label>
          <input type="password" id="confirm_password" name="confirm_password" required onkeyup="validatePassword()">
        
          <span id="message"></span>

          <button type="submit" class="join">가입하기</button>
        </form>
    </div>
  </body>
</html>
