<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/map.css" />
    <title>구글 지도 - 구로 디지털 단지 주변 음식점 검색</title>
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCeZS2hz4UlKMnGFWdOtL2cEd-3ouQ8SvY&libraries=places"
      async
    ></script>
  </head>
  <body>
    <div id="header"></div>

    <div class="main">
      <div id="map"></div>
      <div id="restaurant-list"></div>
      <!-- 음식점 목록을 표시할 DIV -->
    </div>

    <div id="footer"></div>
    <script>
      function initMap() {
        // 구로 디지털 단지의 좌표
        var guroDigitalComplexLocation = new google.maps.LatLng(
          37.485688,
          126.90119
        );

        // 지도를 생성합니다
        var map = new google.maps.Map(document.getElementById("map"), {
          center: guroDigitalComplexLocation, // 구로 디지털 단지를 중심으로 설정
          zoom: 15, // 줌 레벨
        });

        // 구로 디지털 단지에 마커 추가
        var marker = new google.maps.Marker({
          position: guroDigitalComplexLocation,
          map: map,
          title: "구로 디지털 단지", // 마커에 표시될 텍스트
        });

        // 음식점 검색
        var service = new google.maps.places.PlacesService(map);
        service.nearbySearch(
          {
            location: guroDigitalComplexLocation, // 구로 디지털 단지 위치
            radius: 1000, // 검색 반경 (미터)
            type: ["restaurant"], // 검색할 장소 유형
          },
          callback // 콜백 함수
        );

        // 검색 결과 처리
        function callback(results, status) {
          if (status === google.maps.places.PlacesServiceStatus.OK) {
            for (var i = 0; i < results.length; i++) {
              createMarker(results[i]); // 각 음식점에 대해 마커 생성
              addRestaurantToList(results[i]); // 음식점 목록에 추가
            }
          }
        }

        // 마커 생성 함수
        function createMarker(place) {
          var marker = new google.maps.Marker({
            map: map,
            position: place.geometry.location, // 음식점 위치
          });

          console.log(place);

          // 인포윈도우
          google.maps.event.addListener(marker, "click", function () {
            var infowindow = new google.maps.InfoWindow({
              content: `
                <div style="text-align: center;">
                ${
                  place.photos
                    ? `<img src="${place.photos[0].getUrl({
                        maxWidth: 200,
                      })}" alt="${
                        place.name
                      } 사진" style="width: 200px; height: 150px;" />`
                    : ""
                }
                <div>${place.name}</div>
                <div>${place.vicinity}</div>
              </div>
              `, // 음식점 이름
            });
            infowindow.open(map, marker); // 인포윈도우 열기
          });
        }

        // 음식점 목록에 추가하는 함수
        function addRestaurantToList(place) {
          var restaurantList = document.getElementById("restaurant-list");
          var restaurantItem = document.createElement("div");
          restaurantItem.className = "restaurant-item";
          restaurantItem.innerHTML = `
            <span>${place.name} </span> <br>
            <span>${place.vicinity}</span>
          `; // 음식점 이름을 설정

          // 음식점 클릭 시 네이버 검색으로 이동
          restaurantItem.onclick = function () {
            var searchUrl = `https://search.naver.com/search.naver?query=${encodeURIComponent(
              place.name
            )}`;
            window.open(searchUrl, "_blank"); // 새 탭에서 열기
          };

          restaurantList.appendChild(restaurantItem); // 목록에 추가
        }
      }

      // 지도 초기화
      window.onload = initMap; // 페이지 로드 시 initMap 호출
    </script>
    <script src="../js/loadHeader.js"></script>
    <script src="../js/loadFooter.js"></script>
  </body>
</html>
