<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 부트스트랩 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/postPage2.css">
    <script defer src="../js/postPage2.js"></script>
    <title>게시판(게시판 글쓰기 모달 생성)</title>
</head>
<body>

    <h1 class="text-center">게시판(게시판 글쓰기 모달 생성)</h1>

    <!-- 글쓰기 버튼 -->
    <div class="text-end">
        <button class="btn btn-primary me-5" onclick="openModal()">글쓰기</button>
    </div>

    <!-- 게시판 글쓰기 모달 창 -->
    <div id="modal_wrapper_p2" onclick="closeModal()">
        <div id="modal_p2" onclick="event.stopPropagation();">
            <div id="modal_header_p2">
                <h3>게시글 작성</h3>
            </div>
            <div id="modal_body_p2">
                <div class="form_group_p2">
                    <label for="title">제목</label>
                    <input type="text" id="title_p2" class="form_control_p2" placeholder="글 제목을 입력하세요">
                </div>
                <div class="form_group_p2">
                    <label for="content">내용</label>
                    <textarea id="content_p2" class="form-control_p2" placeholder="내용을 입력하세요" rows="4"></textarea>
                </div>
            </div>
        
            <div class="d-flex flex-column align-items-center">
                <!-- 이미지 업로드 -->
                <div class="form_group_p2 d-flex gap-4">
                    <label for="image_p2">대표 이미지</label>
                    <input type="file" id="image_p2" name="upload" class="form-control_p2" accept="image/*" onchange="previewImage(event)">
                </div>

                <!-- 이미지 미리보기 -->
                <div id="imagePreview_p2" style="margin-top: 10px;">
                    <img id="previewImg" src="" alt="미리보기" style="max-width: 100%; display: none;">
                </div>
            </div>

            <div id="modal_footer_p2">
                <button type="button" class="btn btn-secondary btn_close_p2" onclick="closeModal()">닫기</button>
                <button type="button" class="btn btn-primary btn_save_p2" onclick="submitPost()">저장</button>
            </div>
        </div>
    </div>

    <!-- 게시글 상세 모달 창 -->
    <div id="modal_detail_p2" onclick="closeDetailModal()" style="display: none;">
        <div id="modal_p2_detail" onclick="event.stopPropagation();">
            <div id="modal_header_p2_detail">
                <h3 id="detail_title_p2">게시글 상세</h3>
                <!-- 수정 및 삭제 버튼 -->
                <div>
                    <button class="btn btn-outline-primary btn-sm me-2">수정</button>
                    <button class="btn btn-outline-danger btn-sm">삭제</button>
                </div>
            </div>
            <div id="modal_body_p2_detail">
                <div class="form_group_p2">
                    <label>제목</label>
                    <p id="detail_title_text_p2" class="form-control_p2"></p>
                </div>
                <div class="form_group_p2">
                    <label>작성자</label>
                    <p id="detail_author_text_p2" class="form-control_p2"></p>
                </div>
                <div class="form_group_p2">
                    <label>내용</label>
                    <p id="detail_content_text_p2" class="form-control_p2"></p>
                </div>
            </div>
            <div class="d-flex flex-column align-items-center">
                <!-- 상세 이미지 -->
                <div id="detailImagePreview_p2" style="margin-top: 10px;">
                    <img id="detail_previewImg" src="" alt="상세 이미지" style="max-width: 100%; display: none;">
                </div>
            </div>
            <div id="modal_footer_p2_detail">
                <button type="button" class="btn btn-secondary btn_close_p2" onclick="closeDetailModal()">닫기</button>
            </div>
        </div>
    </div>


    <!-- 게시판 그리기(부트스트랩 card View 활용) -->
    <div class="container_p2 mt-4">
        <div class="scrollable_cards_p2 px-4" id="postCards_p2">
            <!-- 게시글이 없을 때 기본 메시지 표시 -->
            <div id="emptyMessage" class="text-center">
                <p>게시글이 아직 없습니다. 게시글을 작성해 주세요.</p>
            </div>
            <!-- 게시글 추가 되는 부분 -->        
        </div>
    </div>

    <!-- 부트스트랩 적용 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
