<!-- 비밀번호 찾기 모달창 -->
 <div id="find-password-modal" class="modal-overlay">
    <div class="modal-window">
        <div class="modal-header">
            <h2>비밀번호 찾기</h2>
            <span class="close-modal" id="close-find-password">&times;</span>
        </div>
        <div class="modal-content">
            <input type="email" placeholder="등록된 이메일을 입력하세요." class="input" id="find-password-email">
            <button class="btn" id="submit-find-password">비밀번호 찾기</button>
        </div>
        <div class="modal-content">
            <p>비밀번호를 잊으셨나요?<br> 등록된 이메일을 입력하시면 비밀번호를 보내드리겠습니다.</p>
            <form id="reset-password-form">
                <input type="e mail" id="email" class="input" placeholder="이메일을 입력하세요." required/>
                <button type="submit" class="btn">이메일 보내기</button>
            </form>
            <div class="ah">
                <a href="#" class="help-link">이메일을 받지 못하셨나요?</a>
                <a href="#" class="back-to-login"로그인 화면으로 돌아가기></a>
            </div>

            <!-- 하단 버튼들 -->
             <div class="ah">
                <!-- 아이디 찾기 -->

                <a href="javascript:void(0)" id="toggle-to-password">비밀번호 찾기</a>
             </div>
        </div>
    </div>
 </div>
